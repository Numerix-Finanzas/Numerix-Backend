spring.application.name=numerix

spring.datasource.url=jdbc:postgresql://localhost:5432/db_numerix
spring.datasource.username=postgres
spring.datasource.password=Luisevas
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# create-drop crea las tablas y carga import.sql (base de datos inicial) en cada inicio.
# Con update se conservan los datos, pero import.sql ya no se ejecuta.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.hbm2ddl.charset_name=UTF-8
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=America/Lima

#No envia el trace al usuario cuando hay error.
server.error.include-stacktrace=never

ip.frontend=http://localhost:4200

jwt.secret=0C/ZZj9OCW7Q74lUM200BayaFq6u12EKyps4NLFQNufowubX5nE1DQT8XRdwv0zUBp7Tns1yhYlwzUCm3maQkg==
jwt.expiracion-minutos=120
# Token cuando se marca "Recordar contraseña" (7 días)
